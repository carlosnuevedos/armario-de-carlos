<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Carlos | Catálogo Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Ops+One&family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-antracita: #1a222a;
            --bg-card: #222c36;
            --bg-card-hover: #2b3744;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --btn-white-bg: #ffffff;
            --btn-white-text: #0f172a;
            --btn-black-bg: #000000;
            --btn-black-text: #ffffff;
            --accent-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            background-color: var(--bg-antracita);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            padding-top: 110px; 
        }

        /* TÍTULO SUPERIOR */
        .brand-top-bar {
            width: 100%;
            background: transparent;
            padding: 0.8rem 1rem;
            text-align: left;
            margin-bottom: 0.5rem;
        }

        .brand-logo {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1.2px;
            color: var(--text-primary);
            text-transform: uppercase;
            line-height: 1;
        }

        /* BARRA DE CATEGORÍAS Y CONTACTO FIJA UNIVERSAL */
        .nav-bar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.6rem;
            gap: 8px;
            width: 100%;
            background: rgba(26, 34, 42, 0.98);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--accent-border);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 99999;
        }

        .nav-categories {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            flex-grow: 1;
            padding-bottom: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .nav-categories::-webkit-scrollbar {
            display: none;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-btn.active {
            background-color: var(--btn-white-bg);
            color: var(--btn-white-text);
            font-weight: 800;
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
        }

        .contact-dropdown-container {
            position: relative;
            flex-shrink: 0;
        }

        .contact-btn {
            background: transparent;
            border: 1px solid var(--accent-border);
            color: var(--text-primary);
            font-family: 'Anton', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 16px;
            transition: all 0.25s ease;
            background-color: rgba(255, 255, 255, 0.03);
            white-space: nowrap;
        }

        .contact-btn:hover {
            background-color: var(--btn-white-bg);
            color: var(--btn-white-text);
        }

        /* CAJA DE CONTACTO FLOTANTE */
        .contact-info-box {
            display: none;
            position: absolute;
            top: 130%;
            right: 0;
            background: #222c36;
            border: 1px solid var(--accent-border);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.85);
            min-width: 220px;
            z-index: 100000;
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.6;
            text-align: left;
        }

        .contact-info-box.show {
            display: block;
        }

        .contact-link {
            color: var(--text-primary);
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .contact-link:hover {
            color: #38ef7d;
        }

        /* BARRA SECUNDARIA DE FOOTBALL FIJA */
        .subcategories-bar {
            display: none;
            width: 100%;
            background: rgba(20, 27, 34, 0.98);
            padding: 8px 10px;
            gap: 6px;
            overflow-x: auto;
            border-bottom: 1px solid var(--accent-border);
            position: fixed;
            top: 45px;
            left: 0;
            z-index: 99998;
            -webkit-overflow-scrolling: touch;
        }

        .subcategories-bar.show {
            display: flex;
        }

        .subcategories-bar::-webkit-scrollbar {
            display: none;
        }

        .sub-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--accent-border);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .sub-btn:hover, .sub-btn.active {
            background: var(--btn-white-bg);
            color: var(--btn-white-text);
        }

        /* HERO BANNER */
        .hero-section {
            position: relative;
            height: 140px;
            margin: 0.6rem 0.6rem;
            clip-path: polygon(0 0, 100% 0, 100% 92%, 95% 100%, 0 96%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            z-index: 1;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            inset: 0;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            background: rgba(18, 24, 30, 0.65);
            z-index: 1;
        }

        .hero-overlay {
            position: relative;
            z-index: 2;
            padding: 0.4rem;
            text-align: center;
        }

        .hero-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 0.1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .hero-subtitle {
            font-size: 0.55rem;
            color: var(--text-secondary);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .main-container {
            padding: 0.4rem 0.6rem 3rem 0.6rem;
            width: 100%;
        }

        .section-header {
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        /* GALERÍA 2 COLUMNAS */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--accent-border);
            border-radius: 6px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            cursor: pointer;
            width: 100%;
            min-width: 0;
        }

        .product-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .img-wrapper {
            width: 100%;
            height: 110px;
            border-radius: 4px;
            overflow: hidden;
            background: #141b22;
            margin-bottom: 4px;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover img {
            transform: scale(1.05);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .brand-tag {
            font-size: 0.5rem;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .product-title {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-btn {
            margin-top: 3px;
            background: var(--btn-black-bg);
            color: var(--btn-black-text);
            border: 1px solid var(--accent-border);
            padding: 3px;
            border-radius: 3px;
            font-size: 0.5rem;
            font-weight: 600;
            text-align: center;
        }

        /* PAGINACIÓN */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .page-btn {
            background: var(--bg-card);
            border: 1px solid var(--accent-border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .page-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .page-btn.active {
            background-color: var(--btn-white-bg);
            color: var(--btn-white-text);
            font-weight: 800;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* VERSIÓN PC */
        @media (min-width: 768px) {
            body {
                padding-top: 130px;
            }
            .brand-top-bar {
                padding: 0 3rem 0.5rem 3rem;
            }
            .brand-logo {
                font-size: 2.5rem;
                letter-spacing: 2px;
            }
            .nav-bar-row {
                padding: 1rem 3rem;
                gap: 20px;
            }
            .subcategories-bar {
                top: 75px;
                padding: 10px 3rem;
            }
            .nav-categories {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
                width: auto;
                overflow-x: visible;
            }
            .nav-btn {
                padding: 8px 18px;
                font-size: 0.85rem;
                border-radius: 30px;
            }
            .contact-btn {
                font-size: 1.4rem;
                letter-spacing: 1.5px;
                padding: 6px 20px;
                border-radius: 30px;
            }
            .contact-info-box {
                min-width: 280px;
                padding: 16px 20px;
                font-size: 0.85rem;
            }
            .sub-btn {
                padding: 6px 14px;
                font-size: 0.8rem;
                border-radius: 16px;
            }
            .hero-section {
                height: 440px;
                margin: 1.5rem 3rem;
            }
            .hero-overlay {
                padding: 2rem;
            }
            .hero-title {
                font-size: 5rem;
                letter-spacing: 3px;
                margin-bottom: 0.75rem;
            }
            .hero-subtitle {
                font-size: 1.1rem;
                letter-spacing: 2.5px;
            }
            .main-container {
                padding: 1rem 3rem 4rem 3rem;
            }
            .section-header {
                margin-bottom: 1.5rem;
            }
            .section-title {
                font-size: 1.2rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 20px;
            }
            .product-card {
                padding: 12px;
                border-radius: 16px;
            }
            .img-wrapper {
                height: 200px;
                border-radius: 10px;
                margin-bottom: 12px;
            }
            .brand-tag {
                font-size: 0.7rem;
            }
            .product-title {
                font-size: 0.85rem;
            }
            .action-btn {
                margin-top: 10px;
                padding: 8px;
                border-radius: 8px;
                font-size: 0.75rem;
            }
        }

        /* MODAL CON ZOOM Y NAVEGACIÓN LATERAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(14, 18, 23, 0.95);
            backdrop-filter: blur(10px);
            z-index: 200000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 1.5rem;
        }

        .modal-container-inner {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 90vw;
            max-height: 75vh;
        }

        .modal-content {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            object-fit: contain;
            cursor: zoom-in;
            transition: transform 0.3s ease;
        }

        .modal-content.zoomed {
            transform: scale(1.6);
            cursor: zoom-out;
        }

        .modal-caption {
            color: var(--text-primary);
            margin-top: 1.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
        }

        .close-modal {
            position: absolute;
            top: 25px;
            right: 30px;
            color: var(--text-primary);
            font-size: 2.5rem;
            cursor: pointer;
            transition: opacity 0.2s;
            z-index: 200005;
            background: rgba(0,0,0,0.4);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--accent-border);
        }

        .close-modal:hover {
            opacity: 0.7;
            background: rgba(255,255,255,0.1);
        }

        /* BOTONES DE NAVEGACIÓN LATERAL (FLECHAS) */
        .nav-modal-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(26, 34, 42, 0.85);
            color: #ffffff;
            border: 1px solid var(--accent-border);
            font-size: 1.8rem;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200004;
            transition: all 0.2s ease;
            user-select: none;
        }

        .nav-modal-btn:hover {
            background: var(--btn-white-bg);
            color: var(--btn-white-text);
            transform: translateY(-50%) scale(1.1);
        }

        .prev-modal-btn {
            left: -70px;
        }

        .next-modal-btn {
            right: -70px;
        }

        @media (max-width: 768px) {
            .prev-modal-btn {
                left: 10px;
            }
            .next-modal-btn {
                right: 10px;
            }
            .nav-modal-btn {
                width: 40px;
                height: 40px;
                font-size: 1.4rem;
                background: rgba(0, 0, 0, 0.6);
            }
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
            border-top: 1px solid var(--accent-border);
        }
    </style>
</head>
<body>

    <!-- BARRA DE CATEGORÍAS PRINCIPAL FIJA -->
    <div class="nav-bar-row">
        <nav class="nav-categories" id="navCategories">
        </nav>

        <div class="contact-dropdown-container">
            <button class="contact-btn" id="contactToggleBtn" type="button">Contacto</button>
            <div class="contact-info-box" id="contactInfoBox">
                E-mail: <a href="https://mail.google.com/mail/?view=cm&fs=1&to=carlosnuevedos@gmail.com" target="_blank" class="contact-link">carlosnuevedos@gmail.com</a><br>
                WhatsApp: <a href="https://wa.me/34655121174" target="_blank" class="contact-link">655 12 11 74</a>
            </div>
        </div>
    </div>

    <!-- BARRA SECUNDARIA DE SUBCATEGORÍAS DE FOOTBALL FIJA -->
    <div class="subcategories-bar" id="subcategoriesBar">
        <button class="sub-btn active" data-filtro="Football">Todo Football</button>
        <div id="subcategoriesListContainer" style="display: flex; gap: 6px;"></div>
    </div>

    <!-- TÍTULO SUPERIOR -->
    <div class="brand-top-bar">
        <div class="brand-logo">Stock Carlos</div>
    </div>

    <section class="hero-section" id="heroBanner">
        <div class="hero-overlay">
            <h1 class="hero-title">¡PREGUNTA POR TU TALLA!</h1>
            <p class="hero-subtitle">Catálogo oficial exclusivo • Stock</p>
        </div>
    </section>

    <main class="main-container" id="galeriaContainer">
        <div class="section-header">
            <span class="section-title">Novedades y catálogo</span>
        </div>
        <div class="gallery-grid" id="galeria"></div>
        <div class="pagination-container" id="paginationContainer"></div>
    </main>

    <!-- MODAL MEJORADO CON ZOOM Y BOTONES LATERALES -->
    <div id="imageModal" class="modal">
        <span class="close-modal" id="closeModalBtn">&times;</span>
        <button class="nav-modal-btn prev-modal-btn" id="prevModalBtn">&#10094;</button>
        <div class="modal-container-inner">
            <img class="modal-content" id="modalImg" alt="Zoom de imagen">
        </div>
        <button class="nav-modal-btn next-modal-btn" id="nextModalBtn">&#10095;</button>
        <div class="modal-caption" id="modalCaption"></div>
    </div>

    <footer>
        <p>© Stock Carlos - Catálogo Académico</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const galeria = document.getElementById('galeria');
            const navCategories = document.getElementById('navCategories');
            const heroBanner = document.getElementById('heroBanner');
            const paginationContainer = document.getElementById('paginationContainer');
            
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const modalCaption = document.getElementById('modalCaption');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const prevModalBtn = document.getElementById('prevModalBtn');
            const nextModalBtn = document.getElementById('nextModalBtn');

            const subcategoriesBar = document.getElementById('subcategoriesBar');
            const subcategoriesListContainer = document.getElementById('subcategoriesListContainer');

            const contactToggleBtn = document.getElementById('contactToggleBtn');
            const contactInfoBox = document.getElementById('contactInfoBox');

            if (contactToggleBtn && contactInfoBox) {
                contactToggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    contactInfoBox.classList.toggle('show');
                });

                document.addEventListener('click', () => {
                    contactInfoBox.classList.remove('show');
                });

                contactInfoBox.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
            }

            let todosLosProductos = [];
            let productosRenderizadosActuales = []; 
            let listaImagenesGlobal = [];
            let filtroActual = { tipo: 'todos', valor: '' };
            let paginaActual = 1;
            const itemsPorPagina = 60;
            let indiceModalActual = 0;

            async function cargarCatalogo() {
                try {
                    const response = await fetch('catalogo_info.json');
                    if (!response.ok) throw new Error('No se pudo cargar el JSON');
                    
                    const data = await response.json();
                    let categoriasPrincipales = new Set();
                    let subcategoriasFootball = new Set();
                    todosLosProductos = [];
                    listaImagenesGlobal = [];

                    for (let [filename, info] of Object.entries(data)) {
                        const carpeta = info.carpeta || info.marca.toLowerCase().replace(" ", "_");
                        const rutaImg = `fotos_yupoo/${carpeta}/${filename}`;
                        
                        listaImagenesGlobal.push(rutaImg);

                        let esFootball = carpeta.toLowerCase().includes('football');
                        let subCatFootball = '';

                        if (esFootball) {
                            const partes = carpeta.split('/');
                            if (partes.length > 1) {
                                subCatFootball = partes[partes.length - 1].replace(/_/g, ' ').toUpperCase();
                                subcategoriasFootball.add(subCatFootball);
                            }
                        } else {
                            categoriasPrincipales.add(info.marca);
                        }

                        todosLosProductos.push({
                            marca: info.marca,
                            subcat: subCatFootball,
                            src: rutaImg,
                            titulo: info.titulo,
                            esFootball: esFootball
                        });
                    }

                    construirNavbar(categoriasPrincipales, subcategoriasFootball);
                    iniciarSlideshowHero();
                    activarFiltros();
                    renderizarPagina();
                    inicializarModalFuncionalidad();

                } catch (error) {
                    console.error("Error al cargar el catálogo:", error);
                    galeria.innerHTML = "<p style='text-align:center; grid-column: 1/-1; padding: 2rem; color: #a0aec0;'>Error al cargar <code>catalogo_info.json</code>. Verifica que el archivo esté en la raíz del repositorio.</p>";
                }
            }

            function construirNavbar(categoriasExistentes, subcategoriasFootball) {
                const ordenPersonalizado = [
                    "Adidas", "Nike", "New Balance", "Football", "Converse", 
                    "Vans", "On Running", "Ugg", "Veja", "Hoka", "Brooks", "Otras", "Todas"
                ];

                let htmlNav = "";

                ordenPersonalizado.forEach(cat => {
                    if (cat === "Football") {
                        if (subcategoriasFootball.size > 0 || Array.from(categoriasExistentes).some(c => c.toLowerCase() === 'football')) {
                            htmlNav += `<button class="nav-btn" id="footballMainBtn" data-filtro="Football" type="button">Football ▾</button>`;
                        }
                    } else if (cat === "Todas") {
                        htmlNav += `<button class="nav-btn" data-filtro="todos" type="button">Todas</button>`;
                    } else {
                        htmlNav += `<button class="nav-btn" data-filtro="${cat}" type="button">${cat}</button>`;
                    }
                });

                navCategories.innerHTML = htmlNav;

                const botonTodas = navCategories.querySelector('[data-filtro="todos"]');
                if (botonTodas) {
                    botonTodas.classList.add('active');
                } else {
                    const primerBoton = navCategories.querySelector('.nav-btn');
                    if (primerBoton) primerBoton.classList.add('active');
                }

                let subHtml = '';
                subcategoriasFootball.forEach(sub => {
                    subHtml += `<button class="sub-btn" data-subfiltro="${sub}" type="button">${sub}</button>`;
                });
                subcategoriesListContainer.innerHTML = subHtml;
            }

            function iniciarSlideshowHero() {
                if (listaImagenesGlobal.length === 0) return;

                setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * listaImagenesGlobal.length);
                    heroBanner.style.backgroundImage = `url('${listaImagenesGlobal[randomIndex]}')`;
                }, 4500);

                const initialIndex = Math.floor(Math.random() * listaImagenesGlobal.length);
                heroBanner.style.backgroundImage = `url('${listaImagenesGlobal[initialIndex]}')`;
            }

            function activarFiltros() {
                const navButtons = document.querySelectorAll('.nav-bar-row .nav-btn');
                const footballMainBtn = document.getElementById('footballMainBtn');
                const subButtons = document.querySelectorAll('.subcategories-bar .sub-btn, #subcategoriesListContainer .sub-btn');

                navButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        const filtroCat = button.getAttribute('data-filtro');

                        if (button === footballMainBtn) {
                            subcategoriesBar.classList.toggle('show');
                            filtroActual = { tipo: 'football_all', valor: '' };
                            navButtons.forEach(btn => btn.classList.remove('active'));
                            button.classList.add('active');
                            paginaActual = 1;
                            renderizarPagina();
                            return;
                        } else {
                            subcategoriesBar.classList.remove('show');
                        }

                        navButtons.forEach(btn => btn.classList.remove('active'));
                        subButtons.forEach(sb => sb.classList.remove('active'));
                        button.classList.add('active');

                        if (filtroCat === 'todos') {
                            filtroActual = { tipo: 'todos', valor: '' };
                        } else if (filtroCat) {
                            filtroActual = { tipo: 'marca', valor: filtroCat };
                        }

                        paginaActual = 1;
                        renderizarPagina();
                        desplazarAGaleria();
                    });
                });

                subButtons.forEach(subBtn => {
                    subBtn.addEventListener('click', () => {
                        subButtons.forEach(sb => sb.classList.remove('active'));
                        subBtn.classList.add('active');

                        const subVal = subBtn.getAttribute('data-subfiltro');
                        const catVal = subBtn.getAttribute('data-filtro');

                        if (catVal === 'Football') {
                            filtroActual = { tipo: 'football_all', valor: '' };
                        } else if (subVal) {
                            filtroActual = { tipo: 'subcat', valor: subVal };
                        }

                        paginaActual = 1;
                        renderizarPagina();
                        desplazarAGaleria();
                    });
                });
            }

            function desplazarAGaleria() {
                const targetElement = document.getElementById('galeriaContainer');
                const headerOffset = 110;
                const elementPosition = targetElement.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
            }

            function renderizarPagina() {
                let productosFiltrados = todosLosProductos.filter(prod => {
                    if (filtroActual.tipo === 'todos') return true;
                    if (filtroActual.tipo === 'marca') return prod.marca.toLowerCase() === filtroActual.valor.toLowerCase();
                    if (filtroActual.tipo === 'football_all') return prod.esFootball || prod.subcat !== '';
                    if (filtroActual.tipo === 'subcat') return prod.subcat === filtroActual.valor;
                    return true;
                });

                const totalPaginas = Math.ceil(productosFiltrados.length / itemsPorPagina) || 1;
                if (paginaActual > totalPaginas) paginaActual = totalPaginas;

                const inicio = (paginaActual - 1) * itemsPorPagina;
                const fin = inicio + itemsPorPagina;
                productosRenderizadosActuales = productosFiltrados.slice(inicio, fin);

                let tarjetasHTML = productosRenderizadosActuales.map((prod, index) => `
                    <div class="product-card" data-index="${index}">
                        <div class="img-wrapper">
                            <img src="${prod.src}" alt="${prod.titulo}" loading="lazy">
                        </div>
                        <div class="card-info">
                            <span class="brand-tag">${prod.marca}</span>
                            <span class="product-title">${prod.titulo}</span>
                            <div class="action-btn">Ver producto</div>
                        </div>
                    </div>
                `).join('');

                galeria.innerHTML = tarjetasHTML.length > 0 ? tarjetasHTML : "<p style='text-align:center; grid-column: 1/-1; padding: 2rem; color: #a0aec0;'>No hay productos en esta categoría.</p>";

                let paginacionHTML = '';
                if (totalPaginas > 1) {
                    paginacionHTML += `<button class="page-btn" ${paginaActual === 1 ? 'disabled' : ''} onclick="cambiarPagina(${paginaActual - 1})">Anterior</button>`;
                    
                    for (let i = 1; i <= totalPaginas; i++) {
                        if (i === 1 || i === totalPaginas || (i >= paginaActual - 2 && i <= paginaActual + 2)) {
                            paginacionHTML += `<button class="page-btn ${i === paginaActual ? 'active' : ''}" onclick="cambiarPagina(${i})">${i}</button>`;
                        } else if (i === paginaActual - 3 || i === paginaActual + 3) {
                            paginacionHTML += `<span style="color: var(--text-secondary); padding: 0 4px;">...</span>`;
                        }
                    }

                    paginacionHTML += `<button class="page-btn" ${paginaActual === totalPaginas ? 'disabled' : ''} onclick="cambiarPagina(${paginaActual + 1})">Siguiente</button>`;
                }
                paginationContainer.innerHTML = paginacionHTML;

                vincularEventosTarjetas();
            }

            window.cambiarPagina = function(numPagina) {
                paginaActual = numPagina;
                renderizarPagina();
                desplazarAGaleria();
            };

            function vincularEventosTarjetas() {
                const cards = document.querySelectorAll('.product-card');
                cards.forEach(card => {
                    card.addEventListener('click', () => {
                        const index = parseInt(card.getAttribute('data-index'));
                        abrirModalEnIndice(index);
                    });
                });
            }

            function abrirModalEnIndice(index) {
                if (productosRenderizadosActuales.length === 0) return;
                indiceModalActual = index;
                const prod = productosRenderizadosActuales[indiceModalActual];
                
                modalImg.src = prod.src;
                modalCaption.textContent = prod.titulo;
                modalImg.classList.remove('zoomed');
                modal.style.display = 'flex';
            }

            function mostrarSiguienteFoto() {
                if (productosRenderizadosActuales.length === 0) return;
                indiceModalActual = (indiceModalActual + 1) % productosRenderizadosActuales.length;
                abrirModalEnIndice(indiceModalActual);
            }

            function mostrarAnteriorFoto() {
                if (productosRenderizadosActuales.length === 0) return;
                indiceModalActual = (indiceModalActual - 1 + productosRenderizadosActuales.length) % productosRenderizadosActuales.length;
                abrirModalEnIndice(indiceModalActual);
            }

            function inicializarModalFuncionalidad() {
                nextModalBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    mostrarSiguienteFoto();
                });

                prevModalBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    mostrarAnteriorFoto();
                });

                modalImg.addEventListener('click', (e) => {
                    e.stopPropagation();
                    modalImg.classList.toggle('zoomed');
                });

                if (closeModalBtn) {
                    closeModalBtn.addEventListener('click', () => {
                        modal.style.display = 'none';
                        modalImg.classList.remove('zoomed');
                    });
                }

                if (modal) {
                    modal.addEventListener('click', (e) => { 
                        if (e.target === modal) {
                            modal.style.display = 'none';
                            modalImg.classList.remove('zoomed');
                        }
                    });
                }

                document.addEventListener('keydown', (e) => {
                    if (modal.style.display === 'flex') {
                        if (e.key === 'Escape') {
                            modal.style.display = 'none';
                            modalImg.classList.remove('zoomed');
                        } else if (e.key === 'ArrowRight') {
                            mostrarSiguienteFoto();
                        } else if (e.key === 'ArrowLeft') {
                            mostrarAnteriorFoto();
                        }
                    }
                });
            }

            cargarCatalogo();
        });
    </script>
</body>
</html>
