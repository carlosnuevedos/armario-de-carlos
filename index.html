<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Carlos | Catálogo Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Ops+One&family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-antracita: #1a222a;
            --bg-card: #222c36;
            --bg-card-hover: #2b3744;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --btn-white-bg: #ffffff;
            --btn-white-text: #0f172a;
            --btn-black-bg: #000000;
            --btn-black-text: #ffffff;
            --accent-border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-antracita);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* 1. TÍTULO SUPERIOR (DESAPARECE AL BAJAR) */
        .brand-top-bar {
            width: 100%;
            background: rgba(26, 34, 42, 0.98);
            padding: 0.5rem 0.8rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-logo {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 1.2px;
            color: var(--text-primary);
            text-transform: uppercase;
            line-height: 1;
        }

        /* 2. BARRA DE CATEGORÍAS FIJA EN EL TOP */
        .nav-bar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.4rem 0.6rem;
            gap: 8px;
            width: 100%;
            background: rgba(26, 34, 42, 0.98);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--accent-border);
            position: sticky;
            top: 0;
            z-index: 9999;
        }

        .nav-categories {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            flex-grow: 1;
            padding-bottom: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .nav-categories::-webkit-scrollbar {
            display: none;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-btn.active {
            background-color: var(--btn-white-bg);
            color: var(--btn-white-text);
            font-weight: 800;
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
        }

        .contact-dropdown-container {
            position: relative;
            flex-shrink: 0;
            z-index: 10000;
        }

        .contact-btn {
            background: transparent;
            border: 1px solid var(--accent-border);
            color: var(--text-primary);
            font-family: 'Anton', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 16px;
            transition: all 0.25s ease;
            background-color: rgba(255, 255, 255, 0.03);
            white-space: nowrap;
        }

        .contact-btn:hover {
            background-color: var(--btn-white-bg);
            color: var(--btn-white-text);
        }

        /* CAJA DE CONTACTO FLOTANTE CON MÁXIMA PRIORIDAD */
        .contact-info-box {
            display: none;
            position: absolute;
            top: 130%;
            right: 0;
            background: #222c36;
            border: 1px solid var(--accent-border);
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            min-width: 220px;
            z-index: 20000;
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.6;
            text-align: left;
        }

        .contact-info-box.show {
            display: block;
        }

        .contact-link {
            color: var(--text-primary);
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .contact-link:hover {
            color: #38ef7d;
        }

        .dropdown-container {
            position: relative;
            display: inline-block;
            z-index: 10000;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 120%;
            left: 0;
            background: #222c36;
            border: 1px solid var(--accent-border);
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            min-width: 150px;
            z-index: 20000;
        }

        .dropdown-container:hover .dropdown-menu,
        .dropdown-menu.show {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dropdown-item {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            text-align: left;
            padding: 6px 10px;
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .dropdown-item:hover, .dropdown-item.active {
            background: var(--btn-white-bg);
            color: var(--btn-white-text);
        }

        .hero-section {
            position: relative;
            height: 140px;
            margin: 0.4rem 0.6rem;
            clip-path: polygon(0 0, 100% 0, 100% 92%, 95% 100%, 0 96%);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            z-index: 1;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            inset: 0;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            background: rgba(18, 24, 30, 0.65);
            z-index: 1;
        }

        .hero-overlay {
            position: relative;
            z-index: 2;
            padding: 0.4rem;
            text-align: center;
        }

        .hero-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 0.1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        .hero-subtitle {
            font-size: 0.55rem;
            color: var(--text-secondary);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .main-container {
            padding: 0.4rem 0.6rem 3rem 0.6rem;
            width: 100%;
        }

        .section-header {
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        /* 2 COLUMNAS ESTRICTAS SIN DESBORDAR */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--accent-border);
            border-radius: 6px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            cursor: pointer;
            width: 100%;
            min-width: 0;
        }

        .product-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .img-wrapper {
            width: 100%;
            height: 110px;
            border-radius: 4px;
            overflow: hidden;
            background: #141b22;
            margin-bottom: 4px;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .brand-tag {
            font-size: 0.5rem;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .product-title {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-btn {
            margin-top: 3px;
            background: var(--btn-black-bg);
            color: var(--btn-black-text);
            border: 1px solid var(--accent-border);
            padding: 3px;
            border-radius: 3px;
            font-size: 0.5rem;
            font-weight: 600;
            text-align: center;
        }

        /* VERSIÓN PC */
        @media (min-width: 768px) {
            .brand-top-bar {
                padding: 1.2rem 3rem 0 3rem;
                background: transparent;
                border-bottom: none;
            }
            .brand-logo {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }
            .nav-bar-row {
                padding: 1rem 3rem;
                gap: 20px;
                position: static;
                background: rgba(26, 34, 42, 0.95);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--accent-border);
            }
            .nav-categories {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
                width: auto;
                overflow-x: visible;
            }
            .nav-btn {
                padding: 8px 18px;
                font-size: 0.85rem;
                border-radius: 30px;
            }
            .contact-btn {
                font-size: 1.4rem;
                letter-spacing: 1.5px;
                padding: 6px 20px;
                border-radius: 30px;
            }
            .contact-info-box {
                min-width: 280px;
                padding: 16px 20px;
                font-size: 0.85rem;
            }
            .dropdown-menu {
                min-width: 180px;
                padding: 10px;
                border-radius: 12px;
            }
            .dropdown-item {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .hero-section {
                height: 440px;
                margin: 1.5rem 3rem;
            }
            .hero-overlay {
                padding: 2rem;
            }
            .hero-title {
                font-size: 5rem;
                letter-spacing: 3px;
                margin-bottom: 0.75rem;
            }
            .hero-subtitle {
                font-size: 1.1rem;
                letter-spacing: 2.5px;
            }
            .main-container {
                padding: 1rem 3rem 4rem 3rem;
            }
            .section-header {
                margin-bottom: 1.5rem;
            }
            .section-title {
                font-size: 1.2rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 20px;
            }
            .product-card {
                padding: 12px;
                border-radius: 16px;
            }
            .img-wrapper {
                height: 200px;
                border-radius: 10px;
                margin-bottom: 12px;
            }
            .brand-tag {
                font-size: 0.7rem;
            }
            .product-title {
                font-size: 0.85rem;
            }
            .action-btn {
                margin-top: 10px;
                padding: 8px;
                border-radius: 8px;
                font-size: 0.75rem;
            }
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(14, 18, 23, 0.92);
            backdrop-filter: blur(10px);
            z-index: 30000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 2rem;
        }

        .modal-content {
            max-width: 85%;
            max-height: 75vh;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            object-fit: contain;
        }

        .modal-caption {
            color: var(--text-primary);
            margin-top: 1.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
        }

        .close-modal {
            position: absolute;
            top: 25px;
            right: 35px;
            color: var(--text-primary);
            font-size: 2.5rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .close-modal:hover {
            opacity: 0.7;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
            border-top: 1px solid var(--accent-border);
        }
    </style>
</head>
<body>

    <!-- 1. TÍTULO SUPERIOR (AHORA SEPARADO Y LIBRE PARA DESAPARECER AL BAJAR) -->
    <div class="brand-top-bar">
        <div class="brand-logo">Stock Carlos</div>
    </div>
    
    <!-- 2. BARRA DE CATEGORÍAS Y CONTACTO (AHORA INDEPENDIENTE Y FIJA ARRIBA) -->
    <div class="nav-bar-row">
        <nav class="nav-categories" id="navCategories">
        </nav>

        <div class="contact-dropdown-container">
            <button class="contact-btn" id="contactToggleBtn" type="button">Contacto</button>
            <div class="contact-info-box" id="contactInfoBox">
                E-mail: <a href="mailto:carlosnuevedos@gmail.com" class="contact-link">carlosnuevedos@gmail.com</a><br>
                WhatsApp: <a href="https://wa.me/34655121174" target="_blank" class="contact-link">655 12 11 74</a>
            </div>
        </div>
    </div>

    <section class="hero-section" id="heroBanner">
        <div class="hero-overlay">
            <h1 class="hero-title">¡PREGUNTA POR TU TALLA!</h1>
            <p class="hero-subtitle">Catálogo oficial exclusivo • Stock</p>
        </div>
    </section>

    <main class="main-container" id="galeriaContainer">
        <div class="section-header">
            <span class="section-title">Novedades y catálogo</span>
        </div>
        <div class="gallery-grid" id="galeria"></div>
    </main>

    <div id="imageModal" class="modal">
        <span class="close-modal" id="closeModalBtn">&times;</span>
        <img class="modal-content" id="modalImg">
        <div class="modal-caption" id="modalCaption"></div>
    </div>

    <footer>
        <p>© Stock Carlos - Catálogo Académico</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const galeria = document.getElementById('galeria');
            const navCategories = document.getElementById('navCategories');
            const heroBanner = document.getElementById('heroBanner');
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const modalCaption = document.getElementById('modalCaption');
            const closeModalBtn = document.getElementById('closeModalBtn');

            const contactToggleBtn = document.getElementById('contactToggleBtn');
            const contactInfoBox = document.getElementById('contactInfoBox');

            if (contactToggleBtn && contactInfoBox) {
                contactToggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    contactInfoBox.classList.toggle('show');
                });

                document.addEventListener('click', () => {
                    contactInfoBox.classList.remove('show');
                });

                contactInfoBox.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
            }

            let listaImagenesGlobal = [];

            async function cargarCatalogo() {
                try {
                    const response = await fetch('catalogo_info.json');
                    if (!response.ok) throw new Error('No se pudo cargar el JSON');
                    
                    const data = await response.json();
                    let categoriasPrincipales = new Set();
                    let subcategoriasFootball = new Set();
                    let tarjetasHTML = [];

                    for (let [filename, info] of Object.entries(data)) {
                        const carpeta = info.carpeta || info.marca.toLowerCase().replace(" ", "_");
                        const rutaImg = `fotos_yupoo/${carpeta}/${filename}`;
                        
                        listaImagenesGlobal.push(rutaImg);

                        let esFootball = carpeta.toLowerCase().includes('football');
                        let subCatFootball = '';

                        if (esFootball) {
                            const partes = carpeta.split('/');
                            if (partes.length > 1) {
                                subCatFootball = partes[partes.length - 1].replace(/_/g, ' ').toUpperCase();
                                subcategoriasFootball.add(subCatFootball);
                            }
                        } else {
                            categoriasPrincipales.add(info.marca);
                        }

                        tarjetasHTML.push(`
                            <div class="product-card" data-categoria="${info.marca}" data-subcat="${subCatFootball}" data-src="${rutaImg}" data-titulo="${info.titulo}">
                                <div class="img-wrapper">
                                    <img src="${rutaImg}" alt="${info.titulo}" loading="lazy">
                                </div>
                                <div class="card-info">
                                    <span class="brand-tag">${info.marca}</span>
                                    <span class="product-title">${info.titulo}</span>
                                    <div class="action-btn">Ver producto</div>
                                </div>
                            </div>
                        `);
                    }

                    galeria.innerHTML = tarjetasHTML.join('');

                    construirNavbar(categoriasPrincipales, subcategoriasFootball);
                    iniciarSlideshowHero();
                    activarFiltros();
                    activarModal();

                } catch (error) {
                    console.error("Error al cargar el catálogo:", error);
                    galeria.innerHTML = "<p style='text-align:center; grid-column: 1/-1; padding: 2rem; color: #a0aec0;'>Error al cargar <code>catalogo_info.json</code>. Verifica que el archivo esté en la raíz del repositorio.</p>";
                }
            }

            function construirNavbar(categoriasExistentes, subcategoriasFootball) {
                const ordenPersonalizado = [
                    "Adidas",
                    "Nike",
                    "New Balance",
                    "Football",
                    "Converse",
                    "Vans",
                    "On Running",
                    "Ugg",
                    "Veja",
                    "Hoka",
                    "Brooks",
                    "Otras",
                    "Todas"
                ];

                let htmlNav = "";

                ordenPersonalizado.forEach(cat => {
                    if (cat === "Football") {
                        if (subcategoriasFootball.size > 0 || Array.from(categoriasExistentes).some(c => c.toLowerCase() === 'football')) {
                            htmlNav += `
                                <div class="dropdown-container">
                                    <button class="nav-btn" id="footballBtn" data-filtro="Football" type="button">Football ▾</button>
                                    <div class="dropdown-menu">
                                        <button class="dropdown-item" data-filtro="Football" type="button">Todo Football</button>
                            `;

                            subcategoriasFootball.forEach(sub => {
                                htmlNav += `<button class="dropdown-item" data-subfiltro="${sub}" type="button">${sub}</button>`;
                            });

                            htmlNav += `</div></div>`;
                        }
                    } else if (cat === "Todas") {
                        htmlNav += `<button class="nav-btn" data-filtro="todos" type="button">Todas</button>`;
                    } else {
                        htmlNav += `<button class="nav-btn" data-filtro="${cat}" type="button">${cat}</button>`;
                    }
                });

                navCategories.innerHTML = htmlNav;
                const primerBoton = navCategories.querySelector('.nav-btn');
                if (primerBoton) primerBoton.classList.add('active');
            }

            function iniciarSlideshowHero() {
                if (listaImagenesGlobal.length === 0) return;

                setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * listaImagenesGlobal.length);
                    heroBanner.style.backgroundImage = `url('${listaImagenesGlobal[randomIndex]}')`;
                }, 4500);

                const initialIndex = Math.floor(Math.random() * listaImagenesGlobal.length);
                heroBanner.style.backgroundImage = `url('${listaImagenesGlobal[initialIndex]}')`;
            }

            function activarFiltros() {
                const buttons = document.querySelectorAll('.nav-bar-row .nav-btn, .nav-bar-row .dropdown-item');
                const cards = document.querySelectorAll('.product-card');

                buttons.forEach(button => {
                    button.addEventListener('click', () => {
                        buttons.forEach(btn => btn.classList.remove('active'));
                        button.classList.add('active');

                        const filtroCat = button.getAttribute('data-filtro');
                        const filtroSubCat = button.getAttribute('data-subfiltro');

                        cards.forEach(card => {
                            const catCard = card.getAttribute('data-categoria');
                            const subCatCard = card.getAttribute('data-subcat');

                            if (filtroCat === 'todos') {
                                card.style.display = 'flex';
                            } else if (filtroCat && catCard.toLowerCase() === filtroCat.toLowerCase()) {
                                card.style.display = 'flex';
                            } else if (filtroCat === 'Football' && (catCard.toLowerCase().includes('football') || subCatCard !== '')) {
                                card.style.display = 'flex';
                            } else if (filtroSubCat && subCatCard === filtroSubCat) {
                                card.style.display = 'flex';
                            } else {
                                card.style.display = 'none';
                            }
                        });

                        const targetElement = document.getElementById('galeriaContainer');
                        const headerOffset = 80;
                        const elementPosition = targetElement.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

                        window.scrollTo({
                            top: offsetPosition,
                            behavior: 'smooth'
                        });
                    });
                });
            }

            function activarModal() {
                const cards = document.querySelectorAll('.product-card');
                cards.forEach(card => {
                    card.addEventListener('click', () => {
                        modal.style.display = 'flex';
                        modalImg.src = card.getAttribute('data-src');
                        modalCaption.textContent = card.getAttribute('data-titulo');
                    });
                });

                if (closeModalBtn) {
                    closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
                }
                if (modal) {
                    modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
                }
                document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.style.display = 'none'; });
            }

            cargarCatalogo();
        });
    </script>
</body>
</html>
